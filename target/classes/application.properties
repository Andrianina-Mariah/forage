spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forage?useSSL=false&serverTimezone=Africa/Nairobi&useLegacyDatetimeCode=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.enabled=false
spring.web.encoding.enabled=true
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true
