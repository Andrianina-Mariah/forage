<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${appTitle}">Forage - Portail</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="page page-login">
	<div class="bg-orb orb-1"></div>
	<div class="bg-orb orb-2"></div>

	<main class="container card glass">
		<header class="card-header">
			<span class="pill">Forage • Portail</span>
			<h1>Bienvenue 👋</h1>
			<p>Connectez-vous pour déposer une demande et suivre son statut.</p>
		</header>

		<form class="form" action="#" method="post">
			<label>
				<span>Email</span>
				<input type="email" name="email" placeholder="nom@email.com">
			</label>
			<label>
				<span>Mot de passe</span>
				<input type="password" name="password" placeholder="••••••••">
			</label>
			<button type="submit" class="btn primary">Se connecter</button>
			<div class="meta-row">
				<a class="link" href="/demande/new">Créer une demande sans compte</a>
				<a class="link" href="/demandes">Voir les demandes</a>
			</div>
		</form>

		<footer class="card-footer">
			<div class="badge">Session démo active</div>
			<p>Astuce: l'espace est prêt pour Spring MVC + Thymeleaf.</p>
		</footer>
	</main>
</body>
</html>
